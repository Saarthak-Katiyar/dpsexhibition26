<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0f"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#F5F5F5" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1440" height="960" fill="url(#bg)"/>
  <rect width="1440" height="960" fill="url(#grid)"/>

  <!-- corridors -->
  <g fill="none" stroke="#F5F5F5" stroke-opacity="0.15" stroke-width="7" stroke-linecap="round">
    <path d="M720 940 L720 596"/>
    <path d="M720 364 L720 320"/>
    <path d="M720 320 L1160 320"/>
    <path d="M720 320 L720 240"/>
    <path d="M1160 320 L1160 240"/>
    <path d="M720 360 L300 360"/>
    <path d="M300 360 L300 340"/>
    <path d="M140 600 L1280 600"/>
    <path d="M410 600 L410 620"/>
    <path d="M240 620 L580 620"/>
    <path d="M240 600 L240 620"/>
    <path d="M1060 600 L1060 620"/>
  </g>

  <!-- garden -->
  <g>
    <rect x="140" y="120" width="320" height="240" rx="8" fill="#2DD4BF" fill-opacity="0.02" stroke="#2DD4BF" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="6 7"/>
    <g fill="none" stroke="#2DD4BF" stroke-opacity="0.16" stroke-width="1">
      <circle cx="192" cy="176" r="10"/><circle cx="264" cy="176" r="10"/><circle cx="336" cy="176" r="10"/><circle cx="408" cy="176" r="10"/>
      <circle cx="228" cy="236" r="10"/><circle cx="300" cy="236" r="10"/><circle cx="372" cy="236" r="10"/><circle cx="444" cy="236" r="10"/>
      <circle cx="192" cy="296" r="10"/><circle cx="264" cy="296" r="10"/><circle cx="336" cy="296" r="10"/><circle cx="408" cy="296" r="10"/>
    </g>
    <text x="300" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" letter-spacing="6" fill="#2DD4BF" fill-opacity="0.8">GARDEN ZONE</text>
  </g>

  <!-- buildings -->
  <g>
    <!-- computer lab -->
    <rect x="560" y="140" width="320" height="180" rx="8" fill="#FFFFFF" fill-opacity="0.018" stroke="#F5F5F5" stroke-opacity="0.13" stroke-width="1.4"/>
    <text x="720" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="6" fill="#F5F5F5" fill-opacity="0.6">COMPUTER LAB</text>
    <!-- innovation lab -->
    <rect x="1000" y="140" width="320" height="180" rx="8" fill="#FFFFFF" fill-opacity="0.018" stroke="#F5F5F5" stroke-opacity="0.13" stroke-width="1.4"/>
    <text x="1160" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="6" fill="#F5F5F5" fill-opacity="0.6">INNOVATION LAB</text>
    <!-- art studio -->
    <rect x="120" y="620" width="240" height="280" rx="8" fill="#FFFFFF" fill-opacity="0.018" stroke="#F5F5F5" stroke-opacity="0.13" stroke-width="1.4"/>
    <text x="240" y="934" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="6" fill="#F5F5F5" fill-opacity="0.6">ART STUDIO</text>
    <!-- main block -->
    <rect x="200" y="620" width="420" height="280" rx="8" fill="#FFFFFF" fill-opacity="0.018" stroke="#F5F5F5" stroke-opacity="0.13" stroke-width="1.4"/>
    <rect x="220" y="640" width="200" height="220" rx="6" fill="#FFFFFF" fill-opacity="0.012" stroke="#F5F5F5" stroke-opacity="0.07" stroke-width="1"/>
    <rect x="440" y="640" width="160" height="220" rx="6" fill="#FFFFFF" fill-opacity="0.012" stroke="#F5F5F5" stroke-opacity="0.07" stroke-width="1"/>
    <text x="320" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" letter-spacing="2" fill="#8A8A93">101</text>
    <text x="520" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" letter-spacing="2" fill="#8A8A93">102</text>
    <text x="410" y="934" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="6" fill="#F5F5F5" fill-opacity="0.6">MAIN BLOCK</text>
    <!-- block b -->
    <rect x="860" y="620" width="420" height="280" rx="8" fill="#FFFFFF" fill-opacity="0.018" stroke="#F5F5F5" stroke-opacity="0.13" stroke-width="1.4"/>
    <rect x="920" y="700" width="320" height="160" rx="6" fill="#FFFFFF" fill-opacity="0.012" stroke="#F5F5F5" stroke-opacity="0.07" stroke-width="1"/>
    <text x="1080" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" letter-spacing="2" fill="#8A8A93">204</text>
    <text x="1070" y="934" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="6" fill="#F5F5F5" fill-opacity="0.6">BLOCK B</text>
  </g>

  <!-- central hall -->
  <path d="M720 596 L637.98 562.02 L604 480 L637.98 397.98 L720 364 L802.02 397.98 L836 480 L802.02 562.02 Z"
    fill="#FFFFFF" fill-opacity="0.02" stroke="#F5F5F5" stroke-opacity="0.16" stroke-width="1.4"/>
  <path d="M720 590.3 L640.1 557.3 L607.4 480 L640.1 402.7 L720 369.7 L799.9 402.7 L832.6 480 L799.9 557.3 Z"
    fill="none" stroke="#F5F5F5" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="3 7"/>
  <text x="720" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="6" fill="#F5F5F5" fill-opacity="0.6">CENTRAL HALL</text>

  <!-- entrance -->
  <g>
    <rect x="640" y="880" width="160" height="80" rx="6" fill="#22D3EE" fill-opacity="0.03" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="5 6"/>
    <path d="M712 880 v12" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
    <text x="720" y="870" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="6" fill="#22D3EE" fill-opacity="0.9">MAIN ENTRANCE</text>
  </g>

  <!-- placeholder ribbon -->
  <g>
    <text x="720" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="40" letter-spacing="10" fill="#F5F5F5" fill-opacity="0.14">FLOOR PLAN</text>
    <text x="720" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" letter-spacing="6" fill="#F5F5F5" fill-opacity="0.28">SAMPLE LAYOUT — REPLACE WITH THE REAL ONE</text>
    <rect x="520" y="66" width="400" height="2" fill="#22D3EE" fill-opacity="0.3"/>
  </g>
</svg>
